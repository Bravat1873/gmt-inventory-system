server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: internal-ops
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/internal_ops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:internal_ops}
    password: ${DB_PASSWORD:InternalOps@2026!}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 52MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

internal-ops:
  attachment-root: ${ATTACHMENT_ROOT:./data/attachments}
  product-image-root: ${PRODUCT_IMAGE_ROOT:./data/product-images}
